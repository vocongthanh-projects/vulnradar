[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vulnradar-cli"
version = "0.1.0"
description = "Local-first vulnerability intelligence and explainable prioritization CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thanh Vo" }]
dependencies = [
  "anthropic>=0.40,<1",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "rich>=13,<15",
  "sqlalchemy>=2,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
vulnradar = "vulnradar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vulnradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
