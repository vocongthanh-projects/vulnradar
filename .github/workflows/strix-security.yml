name: Strix AI Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Scan depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard
          - deep

permissions:
  contents: read

concurrency:
  group: strix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify OpenRouter configuration
        env:
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Missing repository secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run manual full scan
        if: github.event_name == 'workflow_dispatch'
        env:
          STRIX_LLM: openrouter/openrouter/free
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          strix -n -t ./ \
            --scan-mode "${{ inputs.scan_mode }}" \
            --scope-mode full \
            --max-budget 5

      - name: Run pull request diff scan
        if: github.event_name == 'pull_request'
        env:
          STRIX_LLM: openrouter/openrouter/free
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          strix -n -t ./ \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base "origin/${{ github.base_ref }}" \
            --max-budget 1

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-results-${{ github.run_id }}
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14
